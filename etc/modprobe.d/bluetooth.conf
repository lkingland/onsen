# Onsen edition: keep the TP-Link UB500 (RTL8761BU) Bluetooth dongle out of
# USB runtime suspend. btusb enables autosuspend on its own, whatever usbcore
# is told, and a suspended dongle silently stops receiving: the Magic
# Trackpad's link then hits the 20 s supervision timeout and reconnects every
# half minute. With autosuspend off at the driver, the device keeps the USB
# core's default of power/control=on, so no udev rule is needed as well.
#
# This file used to carry disable_ertm=1 for the same symptom. That was a
# misdiagnosis: the trackpad's HID channels run in L2CAP basic mode, which
# enhanced retransmission never touches.
options btusb enable_autosuspend=0

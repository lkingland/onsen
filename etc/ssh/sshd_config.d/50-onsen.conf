# Onsen edition: SSH in is for the tailnet and for keys only.
#
# The YubiKey holds the private keys, so there is never a password to type.
# Nimbus forwards its gpg-agent socket to this machine over ssh (RemoteForward);
# StreamLocalBindUnlink removes the stale socket a dropped session leaves
# behind, so the next forward can bind it and remote signing keeps working.
#
# sshd keeps the first value it reads, and the main sshd_config includes this
# directory at its top, so these settings win.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
StreamLocalBindUnlink yes

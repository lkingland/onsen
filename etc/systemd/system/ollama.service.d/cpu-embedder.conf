# Onsen edition: Ollama serves hamr-memory's embedder (nomic-embed-text,
# 323 MB) on the CPU. On ROCm its llama-server holds the RX 7900 XT at
# 100% busy and about 90 W while idle, for as long as the model is loaded,
# and the fleet embeds about every 40 seconds, so OLLAMA_KEEP_ALIVE cannot
# unload it. Hiding the GPU from this unit only leaves ROCm free for other
# work. Remove this drop-in before running a GPU model through this ollama.
[Service]
Environment=HIP_VISIBLE_DEVICES=-1
Environment=ROCR_VISIBLE_DEVICES=-1

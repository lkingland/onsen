# gpg-agent, as smartsocket's gpg-agent-local runs it.
enable-ssh-support

# PIN cache: 24 hours. Physical access to this machine is outside the threat
# model (unplugging the card is the answer to anything suspicious), and
# unattended jobs such as the nightly GitHub mirror push must find the PIN
# cached. default-cache-ttl is the idle timeout; max-cache-ttl caps an
# entry's whole life.
default-cache-ttl 86400
max-cache-ttl 86400

# pinentry-smart (from the smartsocket repo) forwards the PIN prompt to
# nimbus's own pinentry while nimbus is connected, and otherwise runs
# PINENTRY_SMART_FALLBACK: /usr/bin/pinentry, Arch's chooser (pinentry-gnome3
# on this desktop), set by
# ~/.config/systemd/user/gpg-agent-local.service.d/10-pinentry-fallback.conf.
# An absolute path: gpg-agent runs pinentry-program directly, with no PATH
# search.
pinentry-program /home/drekar/.local/bin/pinentry-smart

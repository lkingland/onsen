# When nimbus is not connected, pinentry-smart falls back to a local
# pinentry. Its own default is pinentry-curses, which takes over whatever
# terminal gpg-agent last heard about (usually a tmux pane). At the console
# the prompt should be the one stock Omarchy gets: /usr/bin/pinentry is
# Arch's chooser, and on a Wayland desktop it picks pinentry-gnome3, which
# the GTK theme styles. (pinentry-gtk is GTK 2 and draws a plain white box.)
# See the smartsocket README, "Pinentry Forwarding" (PINENTRY_SMART_FALLBACK).
# Shipped from config/systemd/user by onsen update. A running agent reads it
# after `systemctl --user daemon-reload && systemctl --user restart gpg-agent-local.service`.
[Service]
Environment=PINENTRY_SMART_FALLBACK=/usr/bin/pinentry

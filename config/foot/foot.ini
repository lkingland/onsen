[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=GoMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Shift+Return as Alt+Return. Grok inserts a newline on ESC CR.
# The CSI-u form is rewritten to a plain Enter by tmux.
\x1b\x0d=Shift+Return
# Alt+Shift+Return as CSI-u. The M-S-Enter split in tmux is commented out;
# this keeps the chord from collapsing to a plain Enter.
\x1b[13;4u=Mod1+Shift+Return

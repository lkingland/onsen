#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[ui]
# Default: git-style unified diff, syntax-highlighted via delta.
# For structural/language-aware diff, use `jj ds <rev>` / `jj dd` (difftastic).
# For interactive multi-file review, use `hunk show <rev>` / `hunk diff`.
diff-formatter = ":git"
pager = "delta"
default-command = "log"

[aliases]
ds = ["show", "--tool", "difft"]
dd = ["diff", "--tool", "difft"]

[user]
name = "Luke Kingland"
email = "luke@lukekingland.com"

# Sign every commit jj creates (snapshots included) with the YubiKey's OpenPGP
# signing subkey — the same key git uses. The card's signature PIN is "not
# forced", so one PIN entry per card session covers everything after it,
# including agents committing as the operator in ~/src (that is deliberate:
# external repos use the operator identity). Never the ssh backend: those
# signatures need an allowed_signers file to verify.
[signing]
behavior = "own"
backend = "gpg"
key = "7DB461E762F282F9!"


# Onsen color theming
# Green=identity/behavior, Cyan=structure, Grey=muted metadata, Red=errors
[colors]
# Primary identifiers - saturated green prefix, grey rest
change_id = { fg = "#50D890", bold = true }
"working_copy change_id" = { fg = "#50D890", bold = true }
commit_id = { fg = "#50D890", bold = true }
"working_copy commit_id" = { fg = "#50D890", bold = true }
rest = { fg = "#505050", bold = false }

# Structure - cyan (closest to pastel blue)
bookmark = "cyan"
bookmarks = "cyan"
local_bookmarks = "cyan"
remote_bookmarks = "cyan"
tag = "cyan"
tags = "cyan"
git_ref = "cyan"
git_refs = "cyan"
git_head = "cyan"

# Metadata
author = { fg = "#8FD9A8" }
committer = { fg = "#8FD9A8" }
"working_copy author" = { fg = "#8FD9A8" }
"working_copy committer" = { fg = "#8FD9A8" }
timestamp = { fg = "#505050" }
"working_copy timestamp" = { fg = "#505050" }

# Status
working_copies = "green"
empty = "bright black"
conflict = "red"
conflict_description = "yellow"

# Errors/warnings
"error heading" = { fg = "red", bold = true }
"warning heading" = { fg = "yellow", bold = true }
"hint heading" = { fg = "cyan", bold = true }

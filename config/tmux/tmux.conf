# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
# Alt+Enter and Alt+Shift+Enter are Grok's newline chords. The splits
# stay on prefix+h and the prefix v s / s p chords.
# bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
# bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
# Foot sends Shift+Return as Alt+Return (ESC CR). This bind covers a
# terminal that still emits S-Enter, and delivers Alt+Enter.
bind -N "Newline in Grok" -n S-Enter send-keys M-Enter
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
# Vim-style splits: prefix v s = :vs (side by side), prefix s p = :sp (stacked).
# v and s are key tables, so the second key completes the chord.
bind -N "Vim split chords (v s)" v switch-client -T v-mode
bind -N "Split pane horizontally (:vs)" -T v-mode s split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically (:sp)" -T s-mode p split-window -v -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Next window" -r Tab select-window -t +1
bind -N "Previous window" -r BTab select-window -t -1
bind -N "Previous window" -r S-Tab select-window -t -1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" C-k kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -N "Last session" l switch-client -l

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -ag terminal-features "xterm-ghostty:extkeys"
set -as terminal-features ",*:clipboard"
# OSC 8. The outer terminal is Ghostty, which understands hyperlinks.
# Tmux drops them unless this feature is set.
set -as terminal-features ",*:hyperlinks"
set -sg escape-time 10

# Status bar
# Bottom, so it does not cover the top of a full-screen program.
# automatic-rename is off: hamr windows keep the names we gave them.
set -g status-position bottom
set -g status-interval 3
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator " "
set -gw automatic-rename off
set -g allow-rename off
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Status, two lines: a blank spacer, then the window pills, hamr-notify, and
# the host. Colours are the terminal's, as stock keeps them, so the theme
# drives them. The Onsen palette ships ~/.config/tmux/onsen.conf with its own.
set -g status 2
set -g status-format[0] ''
set -g status-format[1] '#[align=left]#{W:#{E:window-status-format} ,#{E:window-status-current-format} }#(hamr-notify status)#[align=right]#[fg=brightblack]#H'
set -g status-style 'bg=default,fg=default'
set -g window-status-format "#[fg=brightblack,bg=default]#[fg=default,bg=brightblack] #I #W#{?#{@hugr_state}, #{@hugr_state},} #[fg=brightblack,bg=default]"
set -g window-status-current-format "#[fg=blue,bg=default]#[fg=black,bg=blue] #I #W#{?#{@hugr_state}, #{@hugr_state},}#{?window_zoomed_flag, ,} #[fg=blue,bg=default]"
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g message-style 'bg=default,fg=blue'
set -g message-command-style 'bg=default,fg=blue'
set -g mode-style 'bg=blue,fg=black'
setw -g clock-mode-colour blue
source-file -q ~/.config/tmux/onsen.conf

# Bells pass through, and a window that rang stays marked from another window.
set -g visual-bell off
set -g bell-action any
set -g monitor-bell on

# Hamr session order and pane swap. prefix s 1-0 jumps; prefix s p is the stacked split.
# prefix+h also splits stacked. The session scripts live in ~/.config/tmux.
bind f run-shell "~/.config/tmux/sessions-menu"
bind F display-popup -E '~/.config/tmux/sessions-ordered | fzf --reverse | xargs -r -d "\n" tmux switch-client -t'
bind s switch-client -T s-mode
bind -T s-mode 1 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 1p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind -T s-mode 2 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 2p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind -T s-mode 3 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 3p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind -T s-mode 4 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 4p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind -T s-mode 5 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 5p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind -T s-mode 6 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 6p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind -T s-mode 7 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 7p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind -T s-mode 8 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 8p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind -T s-mode 9 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 9p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind -T s-mode 0 run-shell 's=$(~/.config/tmux/sessions-ordered | sed -n 10p); if [ -n "$s" ]; then tmux switch-client -t "$s"; fi'
bind a run-shell "hamr-notify jump blocked"
bind -r H swap-pane -t '{left-of}'
bind -r J swap-pane -t '{down-of}'
bind -r K swap-pane -t '{up-of}'
bind -r L swap-pane -t '{right-of}'
bind -r left swap-window -t -1 \; select-window -t -1 \; run-shell -b 'hamr-status --save-order'
bind -r right swap-window -t +1 \; select-window -t +1 \; run-shell -b 'hamr-status --save-order'

# Migration 1791972926 clones TPM and installs these once; TPM keeps them
# from then on (prefix+I). vim-tmux-navigator takes C-l.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim-tmux-navigator-no-wrap 1
run '~/.config/tmux/plugins/tpm/tpm'

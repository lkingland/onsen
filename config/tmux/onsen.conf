# The Onsen palette for tmux, sourced by tmux.conf when present: the black
# bar with its spacer line, the green and grey window pills, heavy pane
# borders in green. The pill shapes repeat tmux.conf's formats with colours.
set -g status-format[0] '#[bg=#000000,fg=#000000]▔'
set -g status-format[1] '#[align=left]#{W:#{E:window-status-format} ,#{E:window-status-current-format} }#(hamr-notify status)#[align=right]#[fg=#606060]#H'
set -g status-style 'bg=#000000,fg=#E0E0E0'
set -g window-status-format "#[fg=#1E3A2D,bg=#000000]#[fg=#808080,bg=#1E3A2D] #I #W#{?#{@hugr_state}, #{@hugr_state},} #[fg=#1E3A2D,bg=#000000]"
set -g window-status-current-format "#[fg=#2D5540,bg=#000000]#[fg=#E0E0E0,bg=#2D5540] #I #W#{?#{@hugr_state}, #{@hugr_state},}#{?window_zoomed_flag, ,} #[fg=#2D5540,bg=#000000]"
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#606060'
set -g pane-active-border-style 'fg=#8FD9A8'
set -g message-style 'bg=#000000,fg=#8FD9A8'
set -g message-command-style 'bg=#000000,fg=#8FD9A8'
set -g mode-style 'bg=#2D5540,fg=#E0E0E0'
setw -g clock-mode-colour '#8FD9A8'
